# SPA 서빙. /api 는 인그레스가 백엔드로 먼저 나누므로 여기까지 오지 않는다.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 해시가 붙은 번들은 오래 캐시한다.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 나머지는 앱의 진입점으로 — 새 배포가 바로 보이도록 index.html 은 캐시하지 않는다.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
