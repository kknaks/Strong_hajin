services:
  postgres:
    image: ghcr.io/pgmq/pg16-pgmq:v1.12.0
    environment:
      POSTGRES_DB: ax_demo
      POSTGRES_USER: ax
      POSTGRES_PASSWORD: ax
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ax -d ax_demo"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - ax_demo_pgmq_postgres:/var/lib/postgresql/data

volumes:
  ax_demo_postgres:
  ax_demo_pgmq_postgres:
