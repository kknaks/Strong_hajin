[project]
name = "ax-workspace"
version = "0.1.0"
description = "SCAX modular monolith backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "mcp[cli]>=2,<3",
  "pydantic>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "uvicorn[standard]>=0.30,<1",
  "pypdf>=6.16.2",
  "python-docx>=1.2.0",
  "openpyxl>=3.1.5",
  "python-pptx>=1.0.2",
  "pyyaml>=6,<7",
  "kiwipiepy>=0.23.2",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ax_workspace"]

[dependency-groups]
build = [
  "nuitka==4.2.1",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-xdist>=3.8,<4",
]

[tool.pytest.ini_options]
addopts = "-m 'not integration and not release and not scale'"
testpaths = ["tests"]
markers = [
  "unit: deterministic domain/application tests without transport or SQL semantics",
  "contract: public application, HTTP, MCP, or adapter contract tests",
  "integration: requires an explicit disposable PostgreSQL URL",
  "scale: high-cost synthetic ledger validation run explicitly or by make verify",
  "release: requires network access and validates the distributable package",
  "architecture: package and dependency-boundary assertions",
  "e2e: golden user journeys",
]
