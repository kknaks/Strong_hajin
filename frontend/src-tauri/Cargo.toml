[package]
name = "strong-hajin-shell"
version = "0.0.1"
description = "데스크톱 셸(판: flavors/) — 배포된 HTTPS 웹을 여는 창과 네이티브 커맨드 넷"
authors = ["kknaks"]
license = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "strong_hajin_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# 앱 커맨드의 ACL 권한을 자동 생성한다(build.rs 의 `AppManifest::commands`).
# 원격 origin 에서 오는 호출은 tauri 2.11 의 `webview/mod.rs` 가 **앱 커맨드까지 ACL 로 막는다** —
# capability 가 그 커맨드를 명시하지 않으면 remote 문서는 부를 수 없다. 그래서 자동 생성이 필요하다.
tauri-build = { version = "2.6.3", features = [] }
# build.rs 가 flavors/<판>/tauri.conf.json 을 읽어 판을 가린다.
serde_json = "1"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# SPEC-006 §5: 하한 2.11.1 (GHSA-7gmj-67g7-phm9 — origin 혼동으로 원격 문서가 로컬 전용 커맨드를 부른다).
tauri = { version = "2.11.1", features = [] }
# 연결 실패 전수(U-2)의 수단. **HTTP 클라이언트가 아니라 TLS 악수까지만** 쓴다.
# macOS 는 Security.framework, Windows 는 SChannel 로 내려가 **웹뷰와 같은 OS 신뢰 저장소**를 본다 —
# 그래서 「웹뷰가 거절할 인증서」를 셸도 같은 기준으로 거절한다(Phase 2 의 M-7 대응).
native-tls = "0.2"

# `open_external` 의 구현 수단. **플러그인 권한을 webview 에 주지 않는다** —
# 원격 문서가 부를 수 있는 것은 우리 커맨드 넷뿐이고, opener 는 Rust 쪽에서만 쓴다.
# 그래서 `open_path`·`reveal_item_in_dir` 같은 파일 시스템 표면이 웹에 열리지 않는다(AC-T23).
tauri-plugin-opener = "2"

# 첨부 응답 저장(SPEC-006 U-5 · `download.rs`)·카톡 수집기 업로드(`kakao/`)의 HTTP 클라이언트.
# **native-tls + OS 신뢰 저장소**만 쓴다 — 웹뷰와 같은 기준으로 인증서를 본다. rustls 는 싣지 않는다.
# ⚠ **`native-tls` 를 켠다**(`native-tls-no-default` 가 아니라): ureq 3.x 는 NativeTls **provider 등록**을
# `feature = "native-tls"` 로 가른다. `native-tls-no-default` 만 켜면 `dep:native-tls` 는 들어오지만
# provider 가 등록되지 않아 **https 요청이 런타임 패닉**한다("provider is NativeTls but feature is not
# enabled"). http(로컬)에서는 TLS 를 안 타 드러나지 않다가 운영 https 에서 터진다(수집기 스레드 사망).
ureq = { version = "3.4.2", default-features = false, features = ["native-tls"] }

# Windows(WebView2) 마이크 권한 — 참조 제품 `app/front/src-tauri/src/lib.rs` 의
# `allow_microphone_on_webview2` 를 이식한다. 없으면 `getUserMedia` 가 **프롬프트 없이** 실패한다.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"

# ── 카톡 수집기 (회사판 medi-ax 전용) 의 선택 의존 ─────────────────────────────
# SPEC-009 · SPEC-006 v0.6.0 「외부 채널 수집기 수용」. **개인판 strong-hajin 빌드에는
# feature `kakao-collector` 가 꺼져 아래가 하나도 컴파일되지 않는다**(판 가르기 N-10 · W3-8) —
# 수집·트레이·FDA·카톡 커맨드가 바이너리에 없다. build.rs 가 feature↔판을 대조해 어긋나면 멈춘다.
[dependencies.rusqlite]
# 로컬 카톡 DB = SQLCipher. mykakao Mac 방식(자체 키 유도 + 표준 sqlcipher · DEC-001·SPEC-001)을
# Rust 로 옮긴다. bundled-sqlcipher-vendored-openssl: 시스템 의존 없이 SQLCipher+OpenSSL 을 함께 빌드.
version = "0.32"
features = ["bundled-sqlcipher-vendored-openssl"]
optional = true

[dependencies.keyring]
# 기기 토큰을 **macOS 키체인**에 둔다(창 쿠키 아님 · R3-F1). 응답에 토큰을 돌려주지 않는다.
version = "3"
features = ["apple-native"]
optional = true

[dependencies.sha1]
# 키 유도(secure_key·db_name)에서 쓰는 SHA-1(hashed_uuid).
version = "0.10"
optional = true

[dependencies.sha2]
# 키 유도(SHA-256)·userId 복구(SHA-512 preimage).
version = "0.10"
optional = true

[dependencies.pbkdf2]
# secure_key·db_name 의 PBKDF2-HMAC-SHA256(100k · dklen 128).
version = "0.12"
default-features = false
features = ["hmac"]
optional = true

[dependencies.base64]
# hashed_uuid 의 표준 base64.
version = "0.22"
optional = true

[dependencies.plist]
# 로그인 계정 식별자(user_id) 복구 — Preferences plist 의 REVISION 해시를 읽는다.
version = "1"
optional = true

[features]
# medi-ax 판에서만 켜는 수집기. 빌드는 `--features kakao-collector` 로 켠다(Makefile·run-tauri-local).
kakao-collector = [
  "tauri/tray-icon",
  "tauri/image-png",
  "dep:rusqlite",
  "dep:keyring",
  "dep:sha1",
  "dep:sha2",
  "dep:pbkdf2",
  "dep:base64",
  "dep:plist",
]
